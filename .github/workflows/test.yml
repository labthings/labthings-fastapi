name: Test

on:
  pull_request:
    # All pushes to a PR should run this workflow
  push:
    branches:
      - main


jobs:
  pip_audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: dev-requirements.txt

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install Dependencies
        run: pip install -e . -r dev-requirements.txt

      - name: Print installed packages
        run: pip freeze

      - name: Lint with Ruff
        run: ruff check .

      - name: Format with Ruff
        run: ruff format --check .

      - name: Check spelling
        run: codespell .

      - name: Lint with Flake8 (for docstrings)
        if: ${{ contains('3.12,3.13', matrix.python) }}
        # Flake8 crashes on Python < 3.12, so we exclude those versions.
        # Flake8 is primarily here to lint the docstrings, which
        # does not need to happen under multiple versions.
        run: flake8 src

      - name: Test with pytest
        run: pytest --cov="src" --cov-report="xml" --cov-report="lcov" --cov-report="json"

      - name: Upload code coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python }}
          path: |
            ./coverage.lcov
            ./coverage.json
            ./coverage.xml
      
      - name: Analyse with MyPy
        run: mypy

  test-with-unpinned-deps:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install Dependencies
        run: pip install -r dev-requirements.txt
      
      - name: Print installed packages
        run: pip freeze

      - name: Lint with Ruff
        run: ruff check .

      - name: Format with Ruff
        if: success() || failure()
        run: ruff format --check .
      
      - name: Analyse with MyPy
        if: success() || failure()
        run: mypy

      - name: Test with pytest
        if: success() || failure()
        run: pytest

      - name: Check quickstart, including installation
        if: success() || failure()
        run: bash ./docs/source/quickstart/test_quickstart_example.sh

  base-coverage:
    continue-on-error: true
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.get-coverage.outputs.coverage }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.base_ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.12

      - name: Install Dependencies
        run: pip install -e . -r dev-requirements.txt

      - name: Test with pytest
        run: |
          pytest --cov="src" --cov-report="xml" --cov-report="lcov" --cov-report="json"
          mv coverage.lcov base-coverage.lcov

      - name: Parse coverage percentage
        id: get-coverage
        run: |
          COVERAGE=$(jq -r '.totals.percent_covered_display' coverage.json)
          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT

      - name: Upload code coverage for base branch
        uses: actions/upload-artifact@v7
        with:
          name: base-coverage.lcov
          path: ./base-coverage.lcov

  coverage:
    needs: [test, base-coverage]
    permissions:
      contents: read
      pull-requests: write
      checks: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4  # Needed to generate the PR diff

      - name: Download code coverage report
        uses: actions/download-artifact@v8
        with:
          name: coverage-3.12

      - name: Report diff coverage
        uses: Affanmir/diff-cover-action@v2
        with:
          compare-branch: origin/main
          coverage-files: coverage.xml
          fail-under: '100'

      - name: Parse coverage percentage
        id: get-coverage
        run: |
          COVERAGE=$(jq -r '.totals.percent_covered_display' coverage.json)
          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT

      - name: Update coverage badge
        # Only run this on the main branch so PRs don't overwrite the main badge
        if: github.ref == 'refs/heads/main'
        uses: Schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: 936bcec8e1815a49d1e7f947924ffa3f
          filename: labthings-fastapi-coverage.json
          label: coverage
          message: ${{ steps.get-coverage.outputs.coverage }}%
          valColorRange: ${{ steps.get-coverage.outputs.coverage }}
          maxColorRange: 90
          minColorRange: 50

      - name: Compute the change in coverage
        id: coverage-delta
        env:
          BASE_COV: ${{ needs.base-coverage.outputs.coverage }}
          BRANCH_COV: ${{ steps.get-coverage.outputs.coverage}}
        run: |
          change=$(echo "$BRANCH_COV - $BASE_COV" | bc)
          echo "Coverage changed by $change %"
          echo "delta=$change" >> $GITHUB_OUTPUT
      
      - name: Check coverage tolerance
        if: ${{ steps.coverage-delta.outputs.delta < -0.2 }}
        uses: actions/github-script@v9
        with:
          script: |
              core.setFailed('Coverage has decreased too much.')
