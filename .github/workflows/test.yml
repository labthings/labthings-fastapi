name: Test

on:
  - pull_request

jobs:
  base_coverage:
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.base_ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.12

      - name: Install Dependencies
        run: pip install -e . -r dev-requirements.txt

      - name: Test with pytest
        run: |
          pytest
          mv coverage.lcov base-coverage.lcov

      - name: Upload code coverage for base branch
        uses: actions/upload-artifact@v7
        with:
          name: base-coverage.lcov
          path: ./base-coverage.lcov
  
  pip_audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: dev-requirements.txt

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install Dependencies
        run: pip install -e . -r dev-requirements.txt

      - name: Print installed packages
        run: pip freeze

      - name: Lint with Ruff
        run: ruff check .

      - name: Format with Ruff
        run: ruff format --check .

      - name: Check spelling
        run: codespell .

      - name: Lint with Flake8 (for docstrings)
        if: ${{ contains('3.12,3.13', matrix.python) }}
        # Flake8 crashes on Python < 3.12, so we exclude those versions.
        # Flake8 is primarily here to lint the docstrings, which
        # does not need to happen under multiple versions.
        run: flake8 src

      - name: Test with pytest
        run: pytest

      - name: Upload code coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python }}
          path: |
            ./coverage.lcov
            ./coverage.json
      
      - name: Analyse with MyPy
        run: mypy

  test-with-unpinned-deps:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install Dependencies
        run: pip install -r dev-requirements.txt
      
      - name: Print installed packages
        run: pip freeze

      - name: Lint with Ruff
        run: ruff check .

      - name: Format with Ruff
        if: success() || failure()
        run: ruff format --check .
      
      - name: Analyse with MyPy
        if: success() || failure()
        run: mypy

      - name: Test with pytest
        if: success() || failure()
        run: pytest

      - name: Check quickstart, including installation
        if: success() || failure()
        run: bash ./docs/source/quickstart/test_quickstart_example.sh

  coverage:
    runs-on: ubuntu-latest
    needs: [base_coverage, test]
    steps:
      - name: Download code coverage report
        uses: actions/download-artifact@v8
        with:
          name: coverage-3.12

      - name: Parse coverage percentage
        id: get-coverage
        run: |
          COVERAGE=$(jq -r '.totals.percent_covered_display' coverage.json)
          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT

      - name: Update Coverage Badge
        # Only run this on the main branch so PRs don't overwrite the main badge
        if: github.ref == 'refs/heads/main'
        uses: Schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: 936bcec8e1815a49d1e7f947924ffa3f
          filename: labthings-fastapi-coverage.json
          label: coverage
          message: ${{ steps.get-coverage.outputs.coverage }}%
          valColorRange: ${{ steps.get-coverage.outputs.coverage }}
          maxColorRange: 90
          minColorRange: 50

      - name: Download code coverage report for base branch
        id: download-base-coverage
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: base-coverage.lcov
        
      - name: Generate Code Coverage report
        # Note, due to continue on error (to make job pass) we need to check the
        # Status of the step directly not just use success() or failure()
        if: steps.download-base-coverage.outcome == 'success'
        id: code-coverage
        uses: barecheck/code-coverage-action@v1
        with:
          barecheck-github-app-token: ${{ secrets.BARECHECK_GITHUB_APP_TOKEN }}
          lcov-file: "./coverage.lcov"
          base-lcov-file: "./base-coverage.lcov"
          minimum-ratio: 0
          send-summary-comment: true
          show-annotations: "warning"
        
      - name: Generate Code Coverage report if base job fails
        if: steps.download-base-coverage.outcome == 'failure'
        id: code-coverage-without-base
        uses: barecheck/code-coverage-action@v1
        with:
          barecheck-github-app-token: ${{ secrets.BARECHECK_GITHUB_APP_TOKEN }}
          lcov-file: "./coverage.lcov"
          minimum-ratio: 0
          send-summary-comment: true
          show-annotations: "warning"
