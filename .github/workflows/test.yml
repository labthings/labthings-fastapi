name: Test

on:
  - pull_request

jobs:
  pip_audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: dev-requirements.txt

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install Dependencies
        run: pip install -e . -r dev-requirements.txt

      - name: Print installed packages
        run: pip freeze

      - name: Lint with Ruff
        run: ruff check .

      - name: Format with Ruff
        run: ruff format --check .

      - name: Check spelling
        run: codespell .

      - name: Lint with Flake8 (for docstrings)
        if: ${{ contains('3.12,3.13', matrix.python) }}
        # Flake8 crashes on Python < 3.12, so we exclude those versions.
        # Flake8 is primarily here to lint the docstrings, which
        # does not need to happen under multiple versions.
        run: flake8 src

      - name: Test with pytest
        run: pytest --cov="src" --cov-report="xml" --cov-report="lcov" --cov-report="json"

      - name: Upload code coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python }}
          path: |
            ./coverage.lcov
            ./coverage.json
            ./coverage.xml
      
      - name: Analyse with MyPy
        run: mypy

  test-with-unpinned-deps:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install Dependencies
        run: pip install -r dev-requirements.txt
      
      - name: Print installed packages
        run: pip freeze

      - name: Lint with Ruff
        run: ruff check .

      - name: Format with Ruff
        if: success() || failure()
        run: ruff format --check .
      
      - name: Analyse with MyPy
        if: success() || failure()
        run: mypy

      - name: Test with pytest
        if: success() || failure()
        run: pytest

      - name: Check quickstart, including installation
        if: success() || failure()
        run: bash ./docs/source/quickstart/test_quickstart_example.sh

  coverage:
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download code coverage report
        uses: actions/download-artifact@v8
        with:
          name: coverage-3.12
      - uses: 5monkeys/cobertura-action@master
        with:
          path: coverage.xml
          minimum_coverage: 100
          fail_below_threshold: true
          only_changed_files: true
